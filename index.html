<!DOCTYPE html>
<html style="height: 100%;">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@pyscript/core@0.6.37/dist/core.css">
    <script type="module" src="https://cdn.jsdelivr.net/npm/@pyscript/core@0.6.37/dist/core.js"></script>
    <link rel="stylesheet" href="style.css">
   <style>
      #loading { outline: none; border: none; background: black; }
      #loading::backdrop { background-color: black; }
   </style>
    <script type="module">
      const loading = document.getElementById('loading');
      console.stdlog = console.log.bind(console);
      console.logs = [];
      console.log = function(){
        console.logs.length = 0;
        console.logs.push(Array.from(arguments));

        if(!console.logs[0][0].includes("b'"))
        {
          console.stdlog.apply(console, arguments);

        }
        if(console.logs[0][0].includes("Started Pygame"))
        {
          setTimeout(onLoadingComplete(), "1000");
        } 
    }
    function onLoadingComplete(){
      loading.close()
    }
      loading.showModal()
  </script>
  <script async>
    try{
      var xmlHttp = new XMLHttpRequest()
      xmlHttp.open( "GET", "!URL", true )
      xmlHttp.timeout = 2000;
      xmlHttp.send( null )
    }
    catch(err)
    {
      console.log("Server not available yet...")
    }

  </script>
</head>
<body>
  <dialog id="loading">
    <h1>Loading...</h1>
  </dialog>
  <!-- <img src="test.png" class="number" width="10%"> -->
  <page class="page" >
    <section class="pygame-container">
      <section>
        <h2>MNIST Number Reader</h2>
      </section>
      <section class="pygame-canvas">
        <script type="py-game">
        import pyscript
        from pathlib import Path

        files = ['pygame_core.py', 'GoogleSansCode.ttf']
        for file in files:
          print(f"loading {file}")
          Path(file).write_bytes(await pyscript.fetch(file).bytearray())
        </script>
        <canvas id="canvas"></canvas>
        <script id="script" type="py-game" src="./pygame_ui.py" config="./pyscript.toml">
        </script>
      </section>
      <section>
        <h3>Controls:</h3>
        <ul>
        <li>Left Mouse: Draw Line</li> 
        <li>C: Clear Screen</li>
        <li>P: Predict Number</li> 
        </ul>
      </section>
    </section>
  </page>
</body>
</html>
