<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Recommended meta tags -->
    <title>PyScript Pygame-CE</title>     
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <!-- PyScript CSS -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.2.1/core.css">
    <!-- This script tag bootstraps PyScript -->
    <script type="module" src="https://pyscript.net/releases/2025.2.1/core.js"></script>
</head>
<body>
    <py-config>
        packages = ['numpy', 'pygame-ce', 'tensorflow','skimage']
    </py-config>
    <canvas id="canvas"></canvas>
    <py-script src="pygame1.py"></py-script>
    <!-- <script type="py-game" src="pygame1.py"> </script> -->
</body>
</html>
